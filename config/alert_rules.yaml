alerts:
  - name: High user-visible latency
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: Low answer quality
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 10m
    type: symptom-based
    channel: slack
    owner: llm-quality-oncall
    runbook: docs/alerts.md#alert-3
