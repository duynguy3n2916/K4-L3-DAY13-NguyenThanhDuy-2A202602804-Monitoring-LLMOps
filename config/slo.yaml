service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_example: 50 bad requests per 10000 total requests
  note: >-
    A request is good only when it reaches response_sent within 3000 ms.
    The 99.5% target leaves a 0.5% error budget over 28 days. The current
    baseline must be investigated when P95 exceeds 3000 ms; the threshold is
    not raised merely to hide a regression.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
